<head>
		<title>FCKeditor</title>
		<meta name="robots" content="noindex, nofollow" />
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<script type="text/javascript" src="http://lastekas.tv3.ee/include/FCKeditor/editor/lang/fcklanguagemanager.js"></script>
		<meta http-equiv="Cache-Control" content="public">
		<script type="text/javascript" src="http://lastekas.tv3.ee/include/FCKeditor/editor/js/fck_startup.js"></script>
	</head>
	<body>
		<table height="100%" width="100%" cellpadding="0" cellspacing="0" border="0" style="TABLE-LAYOUT: fixed">
			<tr>
				<td style="OVERFLOW: hidden">
					<table width="100%" cellpadding="0" cellspacing="0" border="0">
						<tr id="Collapsed" style="DISPLAY: none">
							<td id="ExpandHandle" class="TB_Expand" colspan="3" onclick="FCKToolbarSet.Expand();return false;"><img class="TB_ExpandImg" src="http://lastekas.tv3.ee/include/FCKeditor/editor/images/spacer.gif" width="8" height="4"></td>
						</tr>
						<tr id="Expanded" style="DISPLAY: none">
							<td id="CollapseHandle" style="DISPLAY: none" class="TB_Collapse" 
								valign="bottom" onclick="FCKToolbarSet.Collapse();return false;"><img class="TB_CollapseImg" src="http://lastekas.tv3.ee/include/FCKeditor/editor/images/spacer.gif" width="8" height="4"></td>
							<td id="eToolbar" class="TB_ToolbarSet"></td>
							<td width="1" class="TB_SideBorder"></td>
						</tr>
					</table>
				</td>
			</tr>
			<tr id="eWysiwyg">
				<td id="eWysiwygCell" height="100%" valign="top">
					<iframe id="eEditorArea" name="eEditorArea" height="100%" width="100%" frameborder="no" src="http://lastekas.tv3.ee/include/FCKeditor/editor/fckblank.html"></iframe>
				</td>
			</tr>
			<tr id="eSource" style="DISPLAY: none">
				<td class="Source" height="100%" valign="top">
					<textarea id="eSourceField" dir="ltr" style="WIDTH: 100%; HEIGHT: 100%"></textarea>
				</td>
			</tr>
		</table>
	</body>
